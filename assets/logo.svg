<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 666 268" role="img" aria-label="Necros Games">
  <style>
    path {
      fill-opacity: 0;
      stroke: #592D60;
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation:
        draw 1.4s ease forwards,
        fill-in 0.8s ease forwards;
    }

    .games path { stroke: #7E7F7A; }

    path:nth-of-type(1)  { animation-delay: 0.00s, 1.10s; }
    path:nth-of-type(2)  { animation-delay: 0.00s, 1.10s; }
    path:nth-of-type(3)  { animation-delay: 0.12s, 1.22s; }
    path:nth-of-type(4)  { animation-delay: 0.24s, 1.34s; }
    path:nth-of-type(5)  { animation-delay: 0.36s, 1.46s; }
    path:nth-of-type(6)  { animation-delay: 0.48s, 1.58s; }
    path:nth-of-type(7)  { animation-delay: 0.60s, 1.70s; }
    .games path:nth-of-type(1) { animation-delay: 0.80s, 1.90s; }
    .games path:nth-of-type(2) { animation-delay: 0.92s, 2.02s; }
    .games path:nth-of-type(3) { animation-delay: 1.04s, 2.14s; }
    .games path:nth-of-type(4) { animation-delay: 1.16s, 2.26s; }
    .games path:nth-of-type(5) { animation-delay: 1.28s, 2.38s; }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    @keyframes fill-in {
      to { fill-opacity: 1; stroke-opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      path { animation: none; fill-opacity: 1; stroke: none; }
    }
  </style>

